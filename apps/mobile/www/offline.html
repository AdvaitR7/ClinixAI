<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CliniX is offline</title>
    <style>
      /* Tokens from docs/DESIGN.md: Warm Alabaster, Warm Paper, Deep Botanical, Deep Ink, Warm Copper. */
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #f7f2e9;
        color: #151919;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 22rem;
        padding: 28px 24px;
        background: #fffdfc;
        border: 1px solid #e6e0d6;
        border-radius: 20px;
      }
      h1 { margin: 0 0 8px; font-size: 1.25rem; color: #12352c; }
      p { margin: 0 0 24px; font-size: 0.95rem; line-height: 1.5; color: #3d4640; }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: #f5934f;
        color: #151919;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #12352c; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main role="alert">
      <h1>You're offline</h1>
      <p>CliniX needs a connection to open your records.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      // Reloading re-requests the configured server URL; if still offline, this page shows again.
      document.getElementById("retry").addEventListener("click", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
