# CliniX production stack for Dokploy (or a local production run). Supabase stays in the cloud.
#
# Variables are referenced by name only. Set them in Dokploy's environment, or locally with:
#   docker compose --env-file apps/web/.env.local -f infra/dokploy/docker-compose.yml up --build
# NEXT_PUBLIC_* values are build-time inputs for the web image; the API and worker read their
# runtime configuration from services/api/.env and services/worker/.env when those files exist.
name: clinix

services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_AUTH_REDIRECT_BASE_URL: ${NEXT_PUBLIC_AUTH_REDIRECT_BASE_URL:?set NEXT_PUBLIC_AUTH_REDIRECT_BASE_URL}
    image: clinix-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: clinix-api
    restart: unless-stopped
    env_file:
      - path: ../../services/api/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Comma-separated web origins allowed to call the API; production refuses to start without it.
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the deployed web origin}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>r.json()).then(b=>process.exit(b.db==='up'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    image: clinix-worker
    restart: unless-stopped
    env_file:
      - path: ../../services/worker/.env
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
