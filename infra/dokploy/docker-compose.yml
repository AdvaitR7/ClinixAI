# CliniX production stack for Dokploy (Docker Compose type). Supabase stays in the cloud.
#
# Variables are referenced by name only; set them in Dokploy's Environment tab (see docs/DEPLOYMENT.md).
# Domains are assigned in Dokploy's Domains tab: app.<domain> -> web:3000, api.<domain> -> api:4000.
# Traefik terminates HTTPS, so no host ports are published here.
#
# Local run (uses the published images configured for Dokploy):
#   docker compose --env-file <your env file> -f infra/dokploy/docker-compose.yml up
name: clinix

x-api-environment: &api-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
  DB_POOL_MAX: ${DB_POOL_MAX:-4}
  QUEUE_POOL_MAX: ${QUEUE_POOL_MAX:-1}

services:
  # One-shot: applies pending Drizzle migrations, then exits 0. api and worker wait for it.
  migrate:
    image: ${CLINIX_IMAGE_PREFIX:-ghcr.io/advaitr7/clinix}-api:${CLINIX_IMAGE_TAG:?set immutable commit SHA}
    pull_policy: always
    restart: "no"
    command: ["node", "--import", "tsx", "src/migrate.ts"]
    environment:
      <<: *api-environment
    healthcheck:
      disable: true

  web:
    image: ${CLINIX_IMAGE_PREFIX:-ghcr.io/advaitr7/clinix}-web:${CLINIX_IMAGE_TAG:?set immutable commit SHA}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    image: ${CLINIX_IMAGE_PREFIX:-ghcr.io/advaitr7/clinix}-api:${CLINIX_IMAGE_TAG:?set immutable commit SHA}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      PORT: "4000"
      ANDROID_RELEASE_REPOSITORY: AdvaitR7/ClinixAI
      GITHUB_RELEASE_READ_TOKEN: ${GITHUB_RELEASE_READ_TOKEN:-}
      # Exact web origins allowed to call the API; production refuses to start without it.
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to https://clinix.thecontractor.me,https://localhost}
      IDENTITY_ENCRYPTION_KEY: ${IDENTITY_ENCRYPTION_KEY:?set IDENTITY_ENCRYPTION_KEY (64 hex chars)}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?set SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_VERIFICATION_MODE: ${SUPABASE_JWT_VERIFICATION_MODE:?set SUPABASE_JWT_VERIFICATION_MODE}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:?set SUPABASE_JWT_ISSUER}
      SUPABASE_JWT_ALLOWED_ALGORITHMS: ${SUPABASE_JWT_ALLOWED_ALGORITHMS:?set SUPABASE_JWT_ALLOWED_ALGORITHMS}
    expose:
      - "4000"
    networks:
      - dokploy-network
    # Give the api time to drain requests and stop the job queue on redeploy.
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>r.json()).then(b=>process.exit(b.db==='up'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: ${CLINIX_IMAGE_PREFIX:-ghcr.io/advaitr7/clinix}-worker:${CLINIX_IMAGE_TAG:?set immutable commit SHA}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: &worker-environment
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-2}
      QUEUE_POOL_MAX: ${WORKER_QUEUE_POOL_MAX:-1}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY}
      IDENTITY_ENCRYPTION_KEY: ${IDENTITY_ENCRYPTION_KEY:?set IDENTITY_ENCRYPTION_KEY (64 hex chars)}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:?set NINEROUTER_BASE_URL}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:?set NINEROUTER_API_KEY}
      MODEL_ROUTE_ANALYST_1: ${MODEL_ROUTE_ANALYST_1:?set MODEL_ROUTE_ANALYST_1}
      MODEL_ROUTE_ANALYST_2: ${MODEL_ROUTE_ANALYST_2:?set MODEL_ROUTE_ANALYST_2}
      MODEL_ROUTE_JUDGE: ${MODEL_ROUTE_JUDGE:?set MODEL_ROUTE_JUDGE}
      MODEL_ROUTE_OCR: ${MODEL_ROUTE_OCR:?set MODEL_ROUTE_OCR}
      MODEL_ROUTE_STT: ${MODEL_ROUTE_STT:-}
      DEMO_REPLAY: ${DEMO_REPLAY:-}
    stop_grace_period: 20s

  verify:
    image: ${CLINIX_IMAGE_PREFIX:-ghcr.io/advaitr7/clinix}-worker:${CLINIX_IMAGE_TAG:?set immutable commit SHA}
    pull_policy: always
    restart: "no"
    command: ["node", "--import", "tsx", "src/deployment-probe.ts"]
    environment:
      <<: *worker-environment
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      disable: true

networks:
  dokploy-network:
    external: true
